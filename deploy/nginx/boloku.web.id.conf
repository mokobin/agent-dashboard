# BOLO HQ — nginx server block (new, does NOT touch panel-api.boloku.web.id)
# Install: /etc/nginx/sites-available/boloku.web.id  + symlink in sites-enabled
#
# HTTPS: today HTTPS for *.boloku.web.id arrives through the tunnel (chisel), so this
# block listens on plain :80 and the tunnel/edge terminates TLS. See deploy/TUNNEL.md.
# If you later go direct-443 (Oracle inbound rule + Let's Encrypt), run:
#   certbot --nginx -d boloku.web.id -d www.boloku.web.id

server {
    listen 80;
    listen [::]:80;
    server_name boloku.web.id www.boloku.web.id;

    root /opt/boloku/pwa;
    index index.html;

    access_log /var/log/nginx/boloku.access.log;
    error_log  /var/log/nginx/boloku.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # ---- Sync API: live stream (SSE) — no buffering, long timeouts
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- Sync API: everything else
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
        proxy_read_timeout 15s;
    }

    # ---- PWA: these must always revalidate so updates land
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
