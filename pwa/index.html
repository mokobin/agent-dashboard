<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BOLO HQ — Pusat Kendali Agent</title>
  <meta name="description" content="Kantor virtual isometrik: status live lima agent BOLO (Hermes + Muse).">
  <meta name="theme-color" content="#0b1024">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BOLO HQ">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="" width="34" height="34">
      <div>
        <h1>BOLO HQ</h1>
        <p>Pusat Kendali Agent</p>
      </div>
    </div>
    <div class="top-right">
      <div class="clock" aria-label="Jam WIB"><b id="clock-time">--:--:--</b><span id="clock-date">WIB</span></div>
      <button id="conn" class="conn mode-connecting" title="Status koneksi">
        <i></i><span id="conn-label">MENGHUBUNGKAN</span>
      </button>
      <button id="btn-install" class="icon-btn" hidden title="Install aplikasi">⤓</button>
      <button id="btn-settings" class="icon-btn" title="Pengaturan">⚙</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section class="card scene-card">
      <div class="scene-scroll" id="scene-scroll">
      <div class="scene" id="scene">
        <div class="scene-svg"></div>
        <div class="scene-overlay"></div>
        <div class="sim-watermark" hidden>SIMULASI</div>
      </div>
      </div>
      <div class="scene-foot">
        <div class="stats" id="stats"></div>
        <div class="legend">
          <span><i class="dot s-working"></i>Bekerja</span>
          <span><i class="dot s-idle"></i>Idle</span>
          <span><i class="dot s-offline"></i>Offline</span>
        </div>
      </div>
    </section>

    <section class="card panel" id="panel-agents">
      <h2>Panel Kendali Agent</h2>
      <div id="agent-groups"></div>
    </section>

    <section class="card panel" id="panel-command">
      <h2>Pusat Perintah</h2>
      <form id="cmd-form" autocomplete="off">
        <div class="row">
          <select id="cmd-target" aria-label="Target perintah"></select>
        </div>
        <textarea id="cmd-text" rows="2" maxlength="1000" placeholder="Tulis perintah… (mis. ‘Cek airdrop baru dan laporkan’)"></textarea>
        <div class="row between">
          <small id="cmd-hint" class="muted">Perintah masuk antrean. Eksekusi oleh agent = fase berikutnya.</small>
          <button class="btn" type="submit" id="cmd-send">Kirim</button>
        </div>
      </form>
      <h3>Antrean Tugas</h3>
      <ul id="queue" class="list"></ul>
    </section>

    <section class="card panel" id="panel-feed">
      <h2>Feed Aktivitas</h2>
      <ul id="feed" class="list feed"></ul>
    </section>
  </main>

  <footer class="foot">
    <span id="last-sync" class="muted">—</span>
    <span class="muted">boloku.web.id · v<span id="ver">1.0.0</span></span>
  </footer>

  <!-- agent detail sheet -->
  <dialog id="sheet" class="sheet">
    <form method="dialog"><button class="close" aria-label="Tutup">✕</button></form>
    <div id="sheet-body"></div>
  </dialog>

  <!-- settings -->
  <dialog id="settings" class="sheet">
    <form method="dialog"><button class="close" aria-label="Tutup">✕</button></form>
    <h2>Pengaturan</h2>
    <label>Admin token (untuk Pusat Perintah)
      <input id="set-admin" type="password" placeholder="disimpan hanya di perangkat ini">
    </label>
    <label>API base (kosongkan untuk default <code>/api/v1</code>)
      <input id="set-api" type="text" placeholder="/api/v1">
    </label>
    <label class="check"><input id="set-demo" type="checkbox"> Mode demo (SIMULASI) — paksa data simulasi</label>
    <div class="row between">
      <button class="btn ghost" id="set-clear" type="button">Hapus cache lokal</button>
      <button class="btn" id="set-save" type="button">Simpan</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/scene.js"></script>
  <script src="/app.js"></script>
</body>
</html>
